name: Fetch Tiltify Campaign

on:
  workflow_dispatch:

jobs:
  get-campaign:
    runs-on: ubuntu-latest

    env:
      TILTIFY_CLIENT_ID: ${{ secrets.TILTIFY_CLIENT_ID }}
      TILTIFY_CLIENT_SECRET: ${{ secrets.TILTIFY_CLIENT_SECRET }}
      CAMPAIGN_ID: "e6739304-4767-4fcc-9308-107c411bbb55"

    steps:
      - name: Get Tiltify Access Token
        run: |
          BASIC_AUTH=$(printf "%s:%s" "$TILTIFY_CLIENT_ID" "$TILTIFY_CLIENT_SECRET" | base64)

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            https://v5api.tiltify.com/oauth/token \
            -H "Authorization: Basic $BASIC_AUTH" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials")

          echo "HTTP Status: $HTTP_CODE"
          cat response.json

      - name: Get Campaign Data
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Accept: application/json" \
            "https://v5api.tiltify.com/api/public/campaigns/$CAMPAIGN_ID" \
            | jq .