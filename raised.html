<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./main.css">
    <link rel="icon" href="./Assets/icon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>GD All Nighter</title>
    <script>
        async function updateRaised() {
            const raisedElement = document.getElementById("raised");

            try {
                const response = await fetch("https://streamlabscharity.com/api/v1/users/campaigns/herozer/geometry-dash-all-nighter-vol-4");
                if (!response.ok) {
                    throw new Error(`Donation API responded with status ${response.status}`);
                }

                const campaign = await response.json();
                const amountRaised = Number(campaign.amount_raised_usd);
                if (!Number.isFinite(amountRaised)) {
                    throw new Error("Donation API returned an invalid amount");
                }

                raisedElement.textContent = new Intl.NumberFormat("en-US", {
                    style: "currency",
                    currency: "USD"
                }).format(amountRaised / 100);
            } catch (error) {
                console.error("Could not load the donation total:", error);
                raisedElement.textContent = "Donation total unavailable";
            } finally {
                window.setTimeout(updateRaised, 90000);
            }
        }
    </script>
</head>
<body onload="updateRaised()" style="background: transparent;">
    <div id="raised" aria-live="polite">Loading donation total...</div>
</body>
</html>
